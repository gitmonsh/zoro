<!DOCTYPE html>
<html>
<head>
  <title>Zoro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #edf1f7;
      margin: 0;
      min-height: 100vh;
      color: #17202a;
    }

    .screen {
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      min-height: 100vh;
      padding: 28px;
      box-sizing: border-box;
    }

    .assistant {
      width: 380px;
      background: white;
      border: 1px solid #d9dee8;
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(23, 32, 42, 0.18);
      padding: 18px;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .orb {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #2f7cf6;
      box-shadow: 0 0 0 8px rgba(47, 124, 246, 0.12);
    }

    .orb.listening {
      animation: pulse 1.5s infinite;
    }

    .title h1 {
      font-size: 22px;
      margin: 0;
    }

    .title p {
      color: #526172;
      font-size: 13px;
      margin: 2px 0 0;
    }

    .status {
      padding: 10px;
      background: #eef3ff;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      background: #17202a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #2a3a4a;
    }

    .voice-button {
      background: #2f7cf6;
    }

    .voice-button:hover {
      background: #1f63c9;
    }

    .danger-button {
      background: #c0392b;
    }

    .danger-button:hover {
      background: #922b21;
    }

    textarea {
      width: 100%;
      height: 82px;
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #cbd3df;
      font-family: Arial, sans-serif;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
    }

    .answer,
    .memories {
      white-space: pre-wrap;
      background: #f4f6f9;
      border-radius: 8px;
      margin-top: 12px;
      padding: 10px;
      min-height: 20px;
      font-size: 14px;
      max-height: 180px;
      overflow-y: auto;
    }

    .section-title {
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .hint {
      color: #526172;
      font-size: 13px;
      margin-top: 2px;
    }

    .memory-item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 8px;
      padding: 10px;
    }

    .memory-text {
      margin-bottom: 8px;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(47, 124, 246, 0.35);
      }

      70% {
        box-shadow: 0 0 0 14px rgba(47, 124, 246, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(47, 124, 246, 0);
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="assistant">
      <div class="top">
        <div class="orb" id="orb"></div>
        <div class="title">
          <h1>Zoro</h1>
          <p>Local-first desktop assistant</p>
        </div>
      </div>

      <div class="status" id="status">
        Status: loading...
      </div>

      <div class="button-row">
        <button onclick="startZoro()">Start</button>
        <button onclick="wakeZoro()">Wake</button>
        <button onclick="stopZoro()">Stop</button>
      </div>

      <textarea id="question" placeholder="Ask Zoro something..."></textarea>

      <div class="button-row">
        <button class="voice-button" onclick="startVoiceInput()">Listen</button>
        <button onclick="askZoro()">Ask</button>
      </div>

      <div class="hint" id="voiceStatus">
        Voice: idle
      </div>

      <div class="answer" id="answer"></div>

      <div class="section-title">Memory</div>
      <div class="button-row">
        <button onclick="showMemories()">Show</button>
        <button class="danger-button" onclick="deleteAllMemories()">Delete All</button>
      </div>

      <div class="memories" id="memories">
        No memories loaded yet.
      </div>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    function setOrbState(state) {
      const orb = document.getElementById("orb");

      if (state === "waiting" || state === "conversation" || state === "thinking") {
        orb.classList.add("listening");
      } else {
        orb.classList.remove("listening");
      }
    }

    async function updateStatus() {
      const res = await fetch(`${API}/status`);
      const data = await res.json();

      document.getElementById("status").innerText =
        `Status: ${data.state} - ${data.message}`;

      setOrbState(data.state);
    }

    async function startZoro() {
      await fetch(`${API}/start`, { method: "POST" });
      updateStatus();
    }

    async function wakeZoro() {
      await fetch(`${API}/wake`, { method: "POST" });
      updateStatus();
    }

    async function stopZoro() {
      await fetch(`${API}/stop`, { method: "POST" });
      updateStatus();
    }

    async function askZoro() {
      const question = document.getElementById("question").value.trim();

      if (!question) {
        document.getElementById("answer").innerText =
          "Ask me something first.";
        return;
      }

      const res = await fetch(`${API}/ask`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ question })
      });

      const data = await res.json();

      document.getElementById("answer").innerText = data.answer;
      updateStatus();
      showMemories();
    }

    async function showMemories() {
      const res = await fetch(`${API}/memories`);
      const data = await res.json();
      const memoriesBox = document.getElementById("memories");

      if (data.memories.length === 0) {
        memoriesBox.innerText = "Zoro does not remember anything yet.";
        return;
      }

      memoriesBox.innerHTML = "";

      data.memories.forEach(memory => {
        const item = document.createElement("div");
        item.className = "memory-item";

        const text = document.createElement("div");
        text.className = "memory-text";
        text.innerText = `#${memory.id}: ${memory.text}`;

        const button = document.createElement("button");
        button.className = "danger-button";
        button.innerText = "Delete";
        button.onclick = function() {
          deleteMemory(memory.id);
        };

        item.appendChild(text);
        item.appendChild(button);
        memoriesBox.appendChild(item);
      });
    }

    async function deleteMemory(memoryId) {
      await fetch(`${API}/memories/${memoryId}`, {
        method: "DELETE"
      });

      showMemories();
    }

    async function deleteAllMemories() {
      const confirmed = confirm("Delete all Zoro memories?");

      if (!confirmed) {
        return;
      }

      await fetch(`${API}/memories`, {
        method: "DELETE"
      });

      showMemories();
    }

    function startVoiceInput() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        document.getElementById("voiceStatus").innerText =
          "Voice: speech recognition is not supported in this browser. Try Chrome.";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.continuous = false;

      document.getElementById("voiceStatus").innerText =
        "Voice: listening...";

      setOrbState("conversation");

      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;

        document.getElementById("question").value = transcript;
        document.getElementById("voiceStatus").innerText =
          `Voice: heard "${transcript}"`;

        askZoro();
      };

      recognition.onerror = function(event) {
        document.getElementById("voiceStatus").innerText =
          `Voice: error - ${event.error}`;
      };

      recognition.onend = function() {
        const current = document.getElementById("voiceStatus").innerText;

        if (current === "Voice: listening...") {
          document.getElementById("voiceStatus").innerText =
            "Voice: stopped listening";
        }

        updateStatus();
      };
    }

    updateStatus();
    showMemories();
  </script>
</body>
</html>
