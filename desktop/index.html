<!DOCTYPE html>
<html>
<head>
  <title>Zoro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 40px;
      color: #17202a;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 24px;
    }

    h1 {
      margin-top: 0;
    }

    .status {
      padding: 12px;
      background: #eef3ff;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    button {
      background: #17202a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      margin-right: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #2a3a4a;
    }

    textarea {
      width: 100%;
      height: 90px;
      margin-top: 16px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: Arial, sans-serif;
      font-size: 15px;
      box-sizing: border-box;
    }

    .answer {
      white-space: pre-wrap;
      background: #f0f2f5;
      border-radius: 8px;
      margin-top: 16px;
      padding: 12px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Zoro</h1>

    <div class="status" id="status">
      Status: loading...
    </div>

    <button onclick="startZoro()">Start Zoro</button>
    <button onclick="wakeZoro()">Wake</button>
    <button onclick="stopZoro()">Stop</button>

    <textarea id="question" placeholder="Ask Zoro something..."></textarea>
    <br><br>
    <button onclick="askZoro()">Ask Zoro</button>

    <div class="answer" id="answer"></div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    async function updateStatus() {
      const res = await fetch(`${API}/status`);
      const data = await res.json();

      document.getElementById("status").innerText =
        `Status: ${data.state} - ${data.message}`;
    }

    async function startZoro() {
      await fetch(`${API}/start`, { method: "POST" });
      updateStatus();
    }

    async function wakeZoro() {
      await fetch(`${API}/wake`, { method: "POST" });
      updateStatus();
    }

    async function stopZoro() {
      await fetch(`${API}/stop`, { method: "POST" });
      updateStatus();
    }

    async function askZoro() {
      const question = document.getElementById("question").value;

      const res = await fetch(`${API}/ask`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ question })
      });

      const data = await res.json();

      document.getElementById("answer").innerText = data.answer;
      updateStatus();
    }

    updateStatus();
  </script>
</body>
</html>
