<!DOCTYPE html>
<html>
<head>
  <title>Zoro</title>
  <style>
    :root {
      --bg: #edf1f7;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #526172;
      --blue: #2f7cf6;
      --dark: #17202a;
      --danger: #c0392b;
      --border: #d9dee8;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 80% 85%, rgba(47, 124, 246, 0.16), transparent 28%),
        radial-gradient(circle at 20% 20%, rgba(23, 32, 42, 0.08), transparent 24%),
        var(--bg);
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      overflow: hidden;
    }

    .screen {
      min-height: 100vh;
      position: relative;
    }

    .bubble {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: none;
      background:
        radial-gradient(circle at 35% 28%, #79aaff, var(--blue) 55%, #1651c8);
      box-shadow:
        0 18px 45px rgba(47, 124, 246, 0.35),
        0 0 0 10px rgba(47, 124, 246, 0.10);
      cursor: pointer;
      z-index: 10;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .bubble:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow:
        0 22px 60px rgba(47, 124, 246, 0.45),
        0 0 0 12px rgba(47, 124, 246, 0.12);
    }

    .bubble::before,
    .bubble::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      inset: -9px;
      border: 1px solid rgba(47, 124, 246, 0.25);
      animation: ripple 2.4s infinite;
    }

    .bubble::after {
      animation-delay: 1.2s;
    }

    .assistant {
      position: fixed;
      right: 28px;
      bottom: 118px;
      width: 390px;
      max-height: calc(100vh - 150px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(23, 32, 42, 0.22);
      padding: 18px;
      opacity: 0;
      transform: translateY(22px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .assistant.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .orb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, #79aaff, var(--blue) 55%, #1651c8);
      box-shadow: 0 0 0 8px rgba(47, 124, 246, 0.12);
      flex: 0 0 auto;
    }

    .orb.listening {
      animation: breathe 1.5s infinite;
    }

    .title h1 {
      font-size: 22px;
      margin: 0;
    }

    .title p {
      color: var(--muted);
      font-size: 13px;
      margin: 2px 0 0;
    }

    .close-button {
      margin-left: auto;
      background: #eef3ff;
      color: var(--text);
      padding: 8px 10px;
    }

    .status {
      padding: 10px;
      background: #eef3ff;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      background: var(--dark);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: #2a3a4a;
      transform: translateY(-1px);
    }

    .voice-button {
      background: var(--blue);
    }

    .voice-button:hover {
      background: #1f63c9;
    }

    .danger-button {
      background: var(--danger);
    }

    .danger-button:hover {
      background: #922b21;
    }

    textarea {
      width: 100%;
      height: 82px;
      margin-top: 8px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #cbd3df;
      font-family: Arial, sans-serif;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 124, 246, 0.12);
    }

    .answer,
    .memories {
      white-space: pre-wrap;
      background: #f4f6f9;
      border-radius: 10px;
      margin-top: 12px;
      padding: 10px;
      min-height: 20px;
      font-size: 14px;
      max-height: 180px;
      overflow-y: auto;
    }

    .section-title {
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .memory-item {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 8px;
      padding: 10px;
    }

    .memory-text {
      margin-bottom: 8px;
    }

    @keyframes ripple {
      0% {
        opacity: 0.45;
        transform: scale(0.85);
      }

      100% {
        opacity: 0;
        transform: scale(1.45);
      }
    }

    @keyframes breathe {
      0% {
        box-shadow: 0 0 0 4px rgba(47, 124, 246, 0.18);
      }

      50% {
        box-shadow: 0 0 0 12px rgba(47, 124, 246, 0.04);
      }

      100% {
        box-shadow: 0 0 0 4px rgba(47, 124, 246, 0.18);
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <button class="bubble" onclick="toggleAssistant()" aria-label="Toggle Zoro"></button>

    <div class="assistant open" id="assistant">
      <div class="top">
        <div class="orb" id="orb"></div>
        <div class="title">
          <h1>Zoro</h1>
          <p>Local-first desktop assistant</p>
        </div>
        <button class="close-button" onclick="toggleAssistant()">Hide</button>
      </div>

      <div class="status" id="status">
        Status: loading...
      </div>

      <div class="button-row">
        <button onclick="startZoro()">Start</button>
        <button onclick="wakeZoro()">Wake</button>
        <button onclick="stopZoro()">Stop</button>
      </div>

      <textarea id="question" placeholder="Ask Zoro something..."></textarea>

      <div class="button-row">
        <button class="voice-button" onclick="startVoiceInput()">Listen</button>
        <button onclick="askZoro()">Ask</button>
      </div>

      <div class="hint" id="voiceStatus">
        Voice: idle
      </div>

      <div class="answer" id="answer"></div>

      <div class="section-title">Memory</div>
      <div class="button-row">
        <button onclick="showMemories()">Show</button>
        <button class="danger-button" onclick="deleteAllMemories()">Delete All</button>
      </div>

      <div class="memories" id="memories">
        No memories loaded yet.
      </div>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    function toggleAssistant() {
      document.getElementById("assistant").classList.toggle("open");
    }

    function setOrbState(state) {
      const orb = document.getElementById("orb");

      if (state === "waiting" || state === "conversation" || state === "thinking") {
        orb.classList.add("listening");
      } else {
        orb.classList.remove("listening");
      }
    }

    async function updateStatus() {
      const res = await fetch(`${API}/status`);
      const data = await res.json();

      document.getElementById("status").innerText =
        `Status: ${data.state} - ${data.message}`;

      setOrbState(data.state);
    }

    async function startZoro() {
      await fetch(`${API}/start`, { method: "POST" });
      updateStatus();
    }

    async function wakeZoro() {
      await fetch(`${API}/wake`, { method: "POST" });
      updateStatus();
    }

    async function stopZoro() {
      await fetch(`${API}/stop`, { method: "POST" });
      updateStatus();
    }

    async function askZoro() {
      const question = document.getElementById("question").value.trim();

      if (!question) {
        document.getElementById("answer").innerText =
          "Ask me something first.";
        return;
      }

      const res = await fetch(`${API}/ask`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ question })
      });

      const data = await res.json();

      document.getElementById("answer").innerText = data.answer;
      updateStatus();
      showMemories();
    }

    async function showMemories() {
      const res = await fetch(`${API}/memories`);
      const data = await res.json();
      const memoriesBox = document.getElementById("memories");

      if (data.memories.length === 0) {
        memoriesBox.innerText = "Zoro does not remember anything yet.";
        return;
      }

      memoriesBox.innerHTML = "";

      data.memories.forEach(memory => {
        const item = document.createElement("div");
        item.className = "memory-item";

        const text = document.createElement("div");
        text.className = "memory-text";
        text.innerText = `#${memory.id}: ${memory.text}`;

        const button = document.createElement("button");
        button.className = "danger-button";
        button.innerText = "Delete";
        button.onclick = function() {
          deleteMemory(memory.id);
        };

        item.appendChild(text);
        item.appendChild(button);
        memoriesBox.appendChild(item);
      });
    }

    async function deleteMemory(memoryId) {
      await fetch(`${API}/memories/${memoryId}`, {
        method: "DELETE"
      });

      showMemories();
    }

    async function deleteAllMemories() {
      const confirmed = confirm("Delete all Zoro memories?");

      if (!confirmed) {
        return;
      }

      await fetch(`${API}/memories`, {
        method: "DELETE"
      });

      showMemories();
    }

    function startVoiceInput() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        document.getElementById("voiceStatus").innerText =
          "Voice: speech recognition is not supported in this browser. Try Chrome.";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.continuous = false;

      document.getElementById("voiceStatus").innerText =
        "Voice: listening...";

      setOrbState("conversation");

      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;

        document.getElementById("question").value = transcript;
        document.getElementById("voiceStatus").innerText =
          `Voice: heard "${transcript}"`;

        askZoro();
      };

      recognition.onerror = function(event) {
        document.getElementById("voiceStatus").innerText =
          `Voice: error - ${event.error}`;
      };

      recognition.onend = function() {
        const current = document.getElementById("voiceStatus").innerText;

        if (current === "Voice: listening...") {
          document.getElementById("voiceStatus").innerText =
            "Voice: stopped listening";
        }

        updateStatus();
      };
    }

    updateStatus();
    showMemories();
  </script>
</body>
</html>
