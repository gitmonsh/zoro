<!DOCTYPE html>
<html>
<head>
  <title>Zoro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 40px;
      color: #17202a;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 24px;
    }

    h1 {
      margin-top: 0;
    }

    .status {
      padding: 12px;
      background: #eef3ff;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    button {
      background: #17202a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      margin-right: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #2a3a4a;
    }

    .voice-button {
      background: #2f7cf6;
    }

    .voice-button:hover {
      background: #1f63c9;
    }

    textarea {
      width: 100%;
      height: 90px;
      margin-top: 16px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: Arial, sans-serif;
      font-size: 15px;
      box-sizing: border-box;
    }

    .answer,
    .memories {
      white-space: pre-wrap;
      background: #f0f2f5;
      border-radius: 8px;
      margin-top: 16px;
      padding: 12px;
      min-height: 20px;
    }

    .section-title {
      margin-top: 24px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .hint {
      color: #526172;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Zoro</h1>

    <div class="status" id="status">
      Status: loading...
    </div>

    <button onclick="startZoro()">Start Zoro</button>
    <button onclick="wakeZoro()">Wake</button>
    <button onclick="stopZoro()">Stop</button>

    <textarea id="question" placeholder="Ask Zoro something..."></textarea>
    <br><br>

    <button class="voice-button" onclick="startVoiceInput()">Start Listening</button>
    <button onclick="askZoro()">Ask Zoro</button>

    <div class="hint" id="voiceStatus">
      Voice status: idle
    </div>

    <div class="answer" id="answer"></div>

    <div class="section-title">Memory</div>
    <button onclick="showMemories()">Show Memories</button>
    <div class="memories" id="memories">
      No memories loaded yet.
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:8000";

    async function updateStatus() {
      const res = await fetch(`${API}/status`);
      const data = await res.json();

      document.getElementById("status").innerText =
        `Status: ${data.state} - ${data.message}`;
    }

    async function startZoro() {
      await fetch(`${API}/start`, { method: "POST" });
      updateStatus();
    }

    async function wakeZoro() {
      await fetch(`${API}/wake`, { method: "POST" });
      updateStatus();
    }

    async function stopZoro() {
      await fetch(`${API}/stop`, { method: "POST" });
      updateStatus();
    }

    async function askZoro() {
      const question = document.getElementById("question").value.trim();

      if (!question) {
        document.getElementById("answer").innerText =
          "Ask me something first.";
        return;
      }

      const res = await fetch(`${API}/ask`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ question })
      });

      const data = await res.json();

      document.getElementById("answer").innerText = data.answer;
      updateStatus();
    }

    async function showMemories() {
      const res = await fetch(`${API}/memories`);
      const data = await res.json();

      if (data.memories.length === 0) {
        document.getElementById("memories").innerText =
          "Zoro does not remember anything yet.";
        return;
      }

      const memoryText = data.memories
        .map(memory => `- ${memory.text}`)
        .join("\n");

      document.getElementById("memories").innerText =
        `Zoro remembers:\n${memoryText}`;
    }

    function startVoiceInput() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        document.getElementById("voiceStatus").innerText =
          "Voice status: speech recognition is not supported in this browser. Try Chrome.";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.continuous = false;

      document.getElementById("voiceStatus").innerText =
        "Voice status: listening...";

      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;

        document.getElementById("question").value = transcript;
        document.getElementById("voiceStatus").innerText =
          `Voice status: heard "${transcript}"`;

        askZoro();
      };

      recognition.onerror = function(event) {
        document.getElementById("voiceStatus").innerText =
          `Voice status: error - ${event.error}`;
      };

      recognition.onend = function() {
        const current = document.getElementById("voiceStatus").innerText;

        if (current === "Voice status: listening...") {
          document.getElementById("voiceStatus").innerText =
            "Voice status: stopped listening";
        }
      };
    }

    updateStatus();
  </script>
</body>
</html>
